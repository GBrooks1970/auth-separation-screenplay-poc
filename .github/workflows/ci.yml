name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }}, Python 3.12, .NET 9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout auth-separation-screenplay-poc
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sut-polyglot/python-authz/requirements.txt

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build hand-baked-screenplay-pattern provider
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/NeoCognitus70/hand-baked-screenplay-pattern.git ../hand-baked-screenplay-pattern
          cd ../hand-baked-screenplay-pattern
          npm ci
          npm run build

      - name: Install Python dependencies
        run: pip install -r sut-polyglot/python-authz/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Static type checking & .NET build
        run: npm run build

      - name: Run unified verification gate
        run: npm run verify