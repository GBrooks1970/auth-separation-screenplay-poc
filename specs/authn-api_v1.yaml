openapi: 3.1.0
info:
  title: Authentication API (AuthN)
  version: 1.0.0
  description: Establishes user identity, handles sign-in/sign-out, and issues JWT tokens.
servers:
  - url: http://localhost:3001
    description: Local development server
paths:
  /auth/login:
    post:
      summary: Authenticate user credentials
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                required: [token, user_id]
                properties:
                  token:
                    type: string
                  user_id:
                    type: string
        '401':
          description: Invalid credentials
  /auth/verify:
    post:
      summary: Verify JWT token identity
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token verified successfully
        '401':
          description: Invalid or expired token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
